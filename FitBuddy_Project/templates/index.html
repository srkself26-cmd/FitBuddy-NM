<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="card"><h1>FitBuddy</h1><p>AI Fitness Plan Generator using Gemini Models</p><form action="/generate-workout" method="post"><label>Name<input name="username" required></label><label>User ID<input name="user_id" required></label><label>Age<input type="number" name="age" min="1" required></label><label>Weight (kg)<input type="number" name="weight" step="0.1" min="1" required></label><label>Fitness Goal<select name="goal"><option>weight loss</option><option>muscle gain</option><option>flexibility</option><option>general wellness</option></select></label><label>Workout Intensity<select name="intensity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><button>Generate Plan</button></form></main></body></html>
